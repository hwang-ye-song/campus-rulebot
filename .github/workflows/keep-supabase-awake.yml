# Supabase 무료 플랜은 일정 기간 활동이 없으면 프로젝트를 일시정지합니다.
# 정지되면 지식베이스(DB)와 Edge Function(답변 생성)이 함께 멈춰 시연 링크가 동작하지 않으므로,
# 매일 한 번 지식베이스를 한 줄 읽어 활동 상태를 유지합니다. OpenAI 는 호출하지 않습니다.
name: keep-supabase-awake

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 (KST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 지식베이스 한 줄 조회
        env:
          SB_URL: https://rtkirzxoxeevxjxzlhul.supabase.co
          # publishable 키는 클라이언트 공개용 키로, 앱 코드에도 이미 포함되어 있습니다.
          SB_KEY: sb_publishable_qEv1k4Nq6L6MBB57x5Wo3g_mUcri3eF
        run: |
          code=$(curl -s -o body.json -w "%{http_code}" \
            "$SB_URL/rest/v1/kb_chunk?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code"
          cat body.json; echo
          test "$code" = "200"
